<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- SVG 1.1 §11.4: round caps are painted on zero-length subpaths -->
  <line x1="20" y1="20" x2="20" y2="80" stroke="#ff0000" stroke-width="10" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="80" y2="80" stroke="#0000ff" stroke-width="10" stroke-linecap="butt"/>
</svg>
