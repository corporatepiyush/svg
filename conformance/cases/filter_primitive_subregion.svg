<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="50" viewBox="0 0 100 50">
  <filter id="a" x="0" y="0" width="50" height="50" filterUnits="userSpaceOnUse">
    <feFlood flood-color="#0000ff" x="25" width="25"/>
  </filter>
  <filter id="b" primitiveUnits="objectBoundingBox">
    <feFlood flood-color="#008000" x="0.5" width="0.5"/>
  </filter>
  <rect width="50" height="50" fill="#ff0000" filter="url(#a)"/>
  <rect x="50" width="50" height="50" fill="#ff0000" filter="url(#b)"/>
</svg>
