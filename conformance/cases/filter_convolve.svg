<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="c" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feConvolveMatrix orderX="3" orderY="3" preserveAlpha="true"
                        kernelMatrix="1 1 1 1 1 1 1 1 1" divisor="9"/>
    </filter>
  </defs>
  <g filter="url(#c)">
    <rect x="0" y="0" width="50" height="100" fill="#000000"/>
    <rect x="50" y="0" width="50" height="100" fill="#ffffff"/>
  </g>
</svg>
