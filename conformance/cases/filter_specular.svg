<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="s" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feSpecularLighting in="SourceAlpha" surfaceScale="6" specularConstant="1"
                          specularExponent="20" lighting-color="#ffffff">
        <fePointLight x="30" y="-40" z="60"/>
      </feSpecularLighting>
    </filter>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="#808080" filter="url(#s)"/>
</svg>
