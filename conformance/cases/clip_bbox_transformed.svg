<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="c" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath>
  </defs>
  <!-- objectBoundingBox is the element's own user space: the translate must not apply twice -->
  <g transform="translate(100,100)" clip-path="url(#c)"><rect width="80" height="80" fill="#0000ff"/></g>
  <rect x="10" y="10" width="60" height="60" fill="#ff0000" clip-path="url(#c)" transform="rotate(0)"/>
</svg>
