<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="s" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="h" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feColorMatrix type="hueRotate" values="120"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="50" height="100" fill="#ff0000" filter="url(#s)"/>
  <rect x="50" y="0" width="50" height="100" fill="#ff0000" filter="url(#h)"/>
</svg>
