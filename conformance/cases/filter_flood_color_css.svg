<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="50" viewBox="0 0 100 50">
  <style>#f1 feFlood { flood-color: #008000; flood-opacity: 0.5 }</style>
  <filter id="f1" x="0" y="0" width="50" height="50" filterUnits="userSpaceOnUse"><feFlood/></filter>
  <filter id="f2" x="50" y="0" width="50" height="50" filterUnits="userSpaceOnUse" color="#0000ff">
    <feFlood flood-color="currentColor"/>
  </filter>
  <rect width="50" height="50" filter="url(#f1)"/>
  <rect x="50" width="50" height="50" filter="url(#f2)"/>
</svg>
