<svg xmlns="http://www.w3.org/2000/svg" width="100" height="40" viewBox="0 0 100 40">
  <defs>
    <pattern id="base" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="translate(10,0)">
      <rect width="20" height="20" fill="#ff0000"/>
      <rect width="10" height="20" fill="#0000ff"/>
    </pattern>
    <!-- SVG 1.1 §13.3: attributes and children are inherited when absent -->
    <pattern id="p" href="#base"/>
  </defs>
  <rect x="0" y="0" width="100" height="40" fill="url(#p)"/>
</svg>
