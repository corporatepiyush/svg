<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="d" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="g"/>
      <feFlood flood-color="#ff0000" result="c"/>
      <feComposite in="c" in2="g" operator="in"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="20" height="20" fill="#000000" filter="url(#d)"/>
</svg>
