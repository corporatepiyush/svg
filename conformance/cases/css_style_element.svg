<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <style>
    .big { fill: #ff0000; }
    #special { fill: #0000ff; }
    rect { stroke: #000000; stroke-width: 2; }
    g rect { stroke: #00aa00; }
    .imp { fill: #ffff00 !important; }
  </style>
  <rect class="big" x="10" y="10" width="30" height="30"/>
  <rect id="special" class="big" x="50" y="10" width="30" height="30"/>
  <g><rect class="big" x="10" y="60" width="30" height="30"/></g>
  <rect class="big imp" x="50" y="60" width="30" height="30" fill="#ff00ff"/>
</svg>
