<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="red"/>
      <stop offset="0.5" stop-color="yellow"/>
      <stop offset="1" stop-color="blue"/>
    </linearGradient>
    <radialGradient id="rg1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1" spreadMethod="repeat">
      <stop offset="0" stop-color="green"/>
      <stop offset="0.5" stop-color="white"/>
      <stop offset="1" stop-color="green"/>
    </linearGradient>
    <radialGradient id="rg2" cx="0.5" cy="0.5" r="0.5" fx="0.25" fy="0.25">
      <stop offset="0" stop-color="yellow"/>
      <stop offset="1" stop-color="red"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="120" height="120" fill="url(#lg1)"/>
  <circle cx="220" cy="70" r="60" fill="url(#rg1)"/>
  <rect x="310" y="10" width="80" height="120" fill="url(#lg2)"/>
  <rect x="10" y="150" width="120" height="120" fill="url(#lg1)" opacity="0.6"/>
  <ellipse cx="220" cy="210" rx="70" ry="50" fill="url(#rg2)" stroke="url(#lg1)" stroke-width="6"/>
</svg>
