<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <clipPath id="clip1"><circle cx="60" cy="60" r="40"/></clipPath>
    <rect id="r1" x="0" y="0" width="40" height="40" fill="orange"/>
  </defs>
  <rect x="20" y="20" width="80" height="80" fill="coral" clip-path="url(#clip1)"/>
  <use href="#r1" x="150" y="30"/>
  <use href="#r1" x="200" y="30" transform="rotate(45 220 50)"/>
  <line x1="20" y1="140" x2="200" y2="140" stroke="black" stroke-width="4" stroke-dasharray="10,5"/>
  <line x1="20" y1="170" x2="200" y2="170" stroke="black" stroke-width="4"
        stroke-dasharray="2,4" stroke-linecap="round"/>
  <g opacity="0.4"><rect x="250" y="120" width="100" height="100" fill="teal"/></g>
  <rect x="250" y="240" width="120" height="40"
        style="fill: hotpink; stroke: black; stroke-width: 2;"/>
</svg>
