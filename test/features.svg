<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <!-- objectBoundingBox: circle r=0.5 at (0.5,0.5) fills the bbox -->
    <clipPath id="obb" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.5"/>
    </clipPath>
    <!-- userSpaceOnUse with clip-rule=evenodd: square with a square hole -->
    <clipPath id="evenodd">
      <path clip-rule="evenodd" d="M220,20 H380 V180 H220 Z M260,60 H340 V140 H260 Z"/>
    </clipPath>
  </defs>

  <!-- objectBoundingBox clip: square clipped to an inscribed circle -->
  <rect x="20" y="20" width="120" height="120" fill="teal" clip-path="url(#obb)"/>

  <!-- clip-rule evenodd: outer square with a square hole -->
  <rect x="220" y="20" width="160" height="160" fill="orange" clip-path="url(#evenodd)"/>

  <!-- letter-spacing -->
  <text x="20" y="230" font-size="20" fill="black" letter-spacing="6">SPACED</text>
  <text x="20" y="270" font-size="20" fill="black">NORMAL</text>
</svg>