<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900"
     viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.45" stop-color="#172a55"/>
      <stop offset="1" stop-color="#04070f"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0"
                    spreadMethod="reflect">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ef476f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3"
                    spreadMethod="pad"
                    gradientTransform="rotate(15 0.5 0.5)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#5eead4" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"
             patternTransform="rotate(20)">
      <rect width="40" height="40" fill="#0f172a"/>
      <path d="M0 0 H40 M0 0 V40" stroke="#38bdf8" stroke-width="1"
            opacity="0.5"/>
      <circle cx="20" cy="20" r="4" fill="#f472b6"/>
    </pattern>
    <pattern id="dots" width="0.15" height="0.15"
             patternUnits="objectBoundingBox"
             patternContentUnits="objectBoundingBox">
      <rect width="0.15" height="0.15" fill="#111827"/>
      <circle cx="0.075" cy="0.075" r="0.03" fill="#facc15"/>
    </pattern>
    <clipPath id="clipA">
      <rect x="0" y="0" width="360" height="220" rx="24"/>
    </clipPath>
    <clipPath id="clipB">
      <circle cx="180" cy="120" r="110"/>
      <rect x="80" y="40" width="200" height="160"/>
    </clipPath>
    <mask id="fade">
      <rect x="0" y="0" width="360" height="220" fill="url(#fadeGrad)"/>
    </mask>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceAlpha" dx="8" dy="10" result="off"/>
      <feGaussianBlur in="off" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sat">
      <feColorMatrix type="saturate" values="1.8"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f8fafc"/>
    </marker>
    <symbol id="badge" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" fill="url(#warm)" stroke="#f8fafc"
              stroke-width="4"/>
      <path d="M30 52 L45 67 L72 34" fill="none" stroke="#082f49"
            stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <path id="curve" d="M40,780 C220,620 380,900 560,720 S840,560 1140,700"
          fill="none"/>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g opacity="0.9">
    <rect x="40" y="40" width="360" height="220" rx="24" fill="url(#grid)"/>
    <rect x="420" y="40" width="360" height="220" rx="24" fill="url(#dots)"
          stroke="#facc15" stroke-width="2"/>
    <g clip-path="url(#clipA)" transform="translate(800,40)">
      <rect width="360" height="220" fill="url(#warm)"/>
      <circle cx="90" cy="110" r="80" fill="url(#glow)"/>
      <path d="M0 180 Q90 60 180 180 T360 180 V220 H0 Z" fill="#0ea5e9"
            opacity="0.8"/>
    </g>
  </g>

  <g transform="translate(40,300)">
    <rect x="0" y="0" width="220" height="160" rx="20" fill="#22d3ee"
          filter="url(#soft)"/>
    <circle cx="300" cy="80" r="70" fill="url(#glow)" filter="url(#sat)"/>
    <path d="M400 20 L560 20 L520 140 L440 140 Z" fill="url(#warm)"
          filter="url(#drop)"/>
  </g>

  <g transform="translate(40,490)">
    <g mask="url(#fade)">
      <rect width="360" height="200" fill="url(#warm)"/>
      <path d="M0 200 C120 40 240 40 360 200 Z" fill="#a855f7"/>
    </g>
    <g clip-path="url(#clipB)" transform="translate(390,0)">
      <rect width="360" height="220" fill="#111827"/>
      <circle cx="90" cy="110" r="90" fill="url(#glow)"/>
      <circle cx="270" cy="110" r="90" fill="url(#warm)"/>
    </g>
  </g>

  <g transform="translate(800,300)" fill="none">
    <path d="M0 40 C80 -20 180 100 260 20 S340 120 380 40"
          stroke="#f472b6" stroke-width="6" stroke-linecap="round"
          marker-end="url(#arrow)"/>
    <path d="M0 100 L380 100" stroke="#38bdf8" stroke-width="4"
          stroke-dasharray="14 9" stroke-linecap="round"/>
    <path d="M0 150 L380 150" stroke="#facc15" stroke-width="10"
          stroke-dasharray="2 14" stroke-linecap="round"/>
    <path d="M0 200 Q80 100 160 200 T320 200 T380 160"
          stroke="#a3e635" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <use href="#badge" x="800" y="540" width="120" height="120"/>
  <use href="#badge" x="950" y="540" width="80" height="80" opacity="0.8"/>
  <use href="#badge" x="1060" y="540" width="60" height="60" opacity="0.6"/>

  <svg x="820" y="700" width="320" height="150" viewBox="0 0 160 75"
       preserveAspectRatio="xMidYMid meet">
    <rect width="160" height="75" fill="#1e293b"/>
    <circle cx="40" cy="38" r="28" fill="#f97316"/>
    <circle cx="80" cy="38" r="28" fill="#22d3ee" opacity="0.7"/>
    <circle cx="120" cy="38" r="28" fill="#a855f7" opacity="0.7"/>
    <text x="80" y="70" font-size="10" text-anchor="middle"
          fill="#e2e8f0">viewport</text>
  </svg>

  <g fill="#e2e8f0" font-family="sans-serif">
    <text x="40" y="290" font-size="34" font-weight="bold"
          letter-spacing="1.5">Mixed feature document</text>
    <text x="40" y="320" font-size="16" opacity="0.75">gradients patterns
      filters masks markers textPath use nested svg</text>
    <text x="900" y="300" font-size="18" text-anchor="middle" fill="#facc15">
      <tspan x="900" dy="0">TSPAN</tspan>
      <tspan x="900" dy="22" fill="#f472b6">with</tspan>
      <tspan x="900" dy="22" fill="#38bdf8">colors</tspan>
    </text>
    <text font-size="20" fill="#f8fafc" letter-spacing="4">
      <textPath href="#curve" startOffset="6%">text on a curve follows the
        path geometry</textPath>
    </text>
  </g>

  <path d="M80 760 L200 700 L120 820 L160 680 L240 800 Z" fill="#fb7185"
        fill-rule="evenodd" opacity="0.9"/>
  <path d="M300 760 L420 700 L340 820 L380 680 L460 800 Z" fill="url(#warm)"
        fill-rule="nonzero" opacity="0.9"/>

  <image x="520" y="700" width="80" height="80" opacity="0.9"
         preserveAspectRatio="none"
         href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAF0lEQVR4nGP4z8DwH4SRIJoAlA8HGAIAl+Qn2eAIlt0AAAAASUVORK5CYII="/>
</svg>
